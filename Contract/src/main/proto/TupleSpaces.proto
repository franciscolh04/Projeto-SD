syntax = "proto3";
package pt.ulisboa.tecnico.tuplespaces.centralized.contract;


message PutRequest {
  string newTuple = 1;
  int32 client_id = 2;
}
message PutResponse {
}

message ReadRequest {
  string searchPattern = 1;
  int32 client_id = 2;
}
message ReadResponse {
  string result = 1;
}

message TakeRequest {
  string searchPattern = 1;
  int32 client_id = 2;
  int32 tuple_index = 3;
}
message TakeResponse {
  string result = 1;
}

message getTupleSpacesStateRequest {
  int32 client_id = 1;
}
message getTupleSpacesStateResponse {
  repeated string tuple = 1;
}

message GrantRequest {
  int32 client_id = 1;
  string searchPattern = 2;
}

message GrantResponse {
  bool granted = 1;
  int32 tuple_index = 2;
}

message ReleaseRequest {
  int32 client_id = 1;
  int32 tuple_index = 2;
}

message ReleaseResponse {
}

service TupleSpaces {
  rpc put(PutRequest) returns (PutResponse);
  rpc read(ReadRequest) returns (ReadResponse);
  rpc take(TakeRequest) returns (TakeResponse);
  rpc getTupleSpacesState(getTupleSpacesStateRequest) returns (getTupleSpacesStateResponse);

  // Maekawa algorithm
  rpc requestAccess(GrantRequest) returns (GrantResponse);
  rpc releaseAccess(ReleaseRequest) returns (ReleaseResponse);
}

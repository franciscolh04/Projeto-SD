<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TupleSpaces</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1 class="title">TupleSpaces</h1>
      </header>

      <form class="input-row">
        <div
          class="select-container"
          role="combobox"
          aria-expanded="false"
          aria-haspopup="listbox"
        >
          <p class="select-text">take</p>
          <img
            src="https://cdn.builder.io/api/v1/image/assets/TEMP/c075dcb1158b2b0b4cfb6374244655d9a578a89f"
            alt="Dropdown arrow"
            class="dropdown-icon"
          />
        </div>

        <input
          type="text"
          class="input-field"
          value="<vaga,sd,turno1>"
          aria-label="Input field"
        />

        <button type="submit" class="enter-button">Enter</button>
      </form>

      <section class="output-box">
        <div class="output-text">
          <span>OK</span>
          <br />
          <span>&lt;vaga,sd,turno1&gt;</span>
        </div>
      </section>
    </main>
  </body>
</html>
